version: "3.5"
services:
  flashpaper:
    image: ghcr.io/bastii717/flashpaper:v2
    container_name: flashpaper
    restart: always
    volumes:
      - './data:/var/www/html/data'
    ports:
      - '8080:80'
    environment:
      SITE_TITLE: "FlashPaper :: Self-Destructing Message"
      SITE_LOGO: "img/logo.svg"
      DISPLAY_LOGO: "true"
      DISPLAY_TITLE: "false"
      RETURN_FULL_URL: "true"
      BASE_URL: "" # https://example.com/flashpaper
      MAX_SECRET_LENGTH: "3000"
      ANNOUNCEMENT: ""
      # page texts can be overridden with MESSAGES_* variables, see docker/settings.php
      PRUNE_ENABLED: "true"
      PRUNE_MIN_DAYS: 365
      PRUNE_MAX_DAYS: 730
      
