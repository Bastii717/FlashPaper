events {}
http {
  server {
      listen 80;

      root /var/www/html;
      index index.php;
      access_log /dev/null;

      # inline scripts/styles and inline event handlers are part of the
      # page templates, hence 'unsafe-inline'
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;

      # database and static encryption key live here
      location ^~ /data/ {
        deny all;
      }

      location / {
        include mime.types;
        try_files $uri $uri/ =404;
      }

      location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param REQUEST_SCHEME $http_x_forwarded_proto if_not_empty;
      }
  }
}

