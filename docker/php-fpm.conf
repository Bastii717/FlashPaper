[www]
user = nginx
group = nginx
listen = /var/run/php-fpm/php-fpm.sock
listen.owner = nginx
listen.group = nginx

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
access.log = /dev/null

; PHP errors go to the php-fpm error log only. With FastCGI logging left on, php-fpm
; would also hand them to nginx, which logs them together with the request line
; and therefore the ?k= secret key. catch_workers_output alone is not enough for that.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[fastcgi.logging] = off

security.limit_extensions = .php

clear_env = no
